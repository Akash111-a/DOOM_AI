[project]
name = "doomai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akash111", email = "godlike89765@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "pydantic>=2.14.3",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
doomai = "doomai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
